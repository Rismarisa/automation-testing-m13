
name: Automation Testing M13 - Staging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  automation-test:
    name: Selenium and PyTest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASS: ${{ secrets.TEST_PASS }}
      BROWSER: chrome
      HEADLESS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Environment
        run: |
          python --version
          python -m pytest --version
          google-chrome --version
          mkdir -p reports

      - name: Start Staging Application
        run: |
          nohup python -u app.py > reports/server.log 2>&1 &

      - name: Health Check
        run: |
          for attempt in {1..10}; do
            if python health_check.py; then
              exit 0
            fi
            sleep 2
          done
          echo "Environment belum siap diuji"
          exit 1

      - name: Run Automation Testing
        run: |
          python -m pytest tests/test_login.py -v --junitxml=reports/test-results.xml

      - name: Upload Testing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-testing-report
          path: reports/
          retention-days: 30
